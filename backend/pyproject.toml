[project]
name = "experiment-review-copilot"
version = "0.1.0"
description = "AI Decision Support System for Product Experimentation"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly (captured via `pip freeze` against a known-working
    # install) rather than left as open ">=" ranges. Several of these
    # packages are still pre-1.0 (uvicorn, statsmodels, langsmith,
    # python-multipart) where a minor bump can be breaking per semver,
    # and langchain/langgraph/langchain-openai ship frequent API
    # changes that can break this app with no source change on our
    # side. Bump deliberately, one package at a time, re-running the
    # full test suite — not via a blanket `pip install -U`.
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "pandas==3.0.2",
    "openpyxl==3.1.5",  # needed for pd.ExcelFile's default engine detection / .xls fallback
    "python-calamine==0.8.2",  # fast Rust-based .xlsx engine — openpyxl alone took 20s+ on a 200K-row sheet, enough to trip Render's request timeout (502)
    "numpy==2.4.4",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "langgraph==1.2.10",
    "langchain==1.3.14",
    "langchain-openai==1.4.1",  # used for OpenRouter (OpenAI-compatible endpoint)
    "langsmith==0.10.16",  
    "sqlalchemy==2.0.44",       
    "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",  # FastAPI TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
# Without this, setuptools' auto-discovery sees BOTH `app/` (the real
# package) and `data/` (demo CSVs, not a package) as top-level
# candidates and refuses to build ("Multiple top-level packages
# discovered in a flat-layout"). Explicitly restrict discovery to `app`.
include = ["app*"]
